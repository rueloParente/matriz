global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: matriz
    metrics_path: /actuator/prometheus
    basic_auth:
      username: prometheus
      password_file: /run/secrets/metrics_password
    static_configs:
      - targets: ["homelab-server-1:8085"]
        labels:
          environment: homelab

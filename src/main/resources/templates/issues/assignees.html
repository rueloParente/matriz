<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">
<head><title>Assignees</title></head>
<body><main class="container py-4">
  <div id="issue-assignees" th:fragment="assignees">
    <h3 class="h5">Assignees</h3>
    <div th:if="${error != null}" class="alert alert-danger" th:text="${error}">Error</div>
    <p th:if="${#lists.isEmpty(assigned)}">Unassigned</p>
    <ul class="assignee-list"><li th:each="person : ${assigned}">
      <span th:text="${person.displayName}">Person</span>
      <form method="post" class="m-0" th:action="@{/projects/{key}/issues/{number}/assignees/{id}/delete(key=${project.key},number=${number},id=${person.id})}"
            th:hx-post="@{/projects/{key}/issues/{number}/assignees/{id}/delete(key=${project.key},number=${number},id=${person.id})}" hx-target="#issue-assignees" hx-swap="outerHTML">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="btn btn-outline-secondary btn-sm">Remove</button>
      </form>
    </li></ul>
    <form method="post" class="assignee-form" th:action="@{/projects/{key}/issues/{number}/assignees(key=${project.key},number=${number})}"
          th:hx-post="@{/projects/{key}/issues/{number}/assignees(key=${project.key},number=${number})}" hx-target="#issue-assignees" hx-swap="outerHTML">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <label for="assignee-user" class="form-label">Add assignee</label>
      <select id="assignee-user" name="userId" class="form-select" required>
        <option value="" disabled th:selected="${userId == null or userId == ''}">Choose a person</option>
        <option th:if="${error != null}" th:value="${userId}" selected disabled
                th:text="|Unavailable user (${userId})|">Unavailable user</option>
        <option th:each="person : ${eligible}" th:value="${person.id}" th:text="${person.displayName}">Person</option>
      </select>
      <button type="submit" class="btn btn-primary btn-sm">Add</button>
    </form>
  </div>
</main></body></html>
